<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Threat Intelligence Dashboard</title>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --alert-red: #ef4444;
            --safe-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-safe {
            background: rgba(16, 185, 129, 0.2);
            color: var(--safe-green);
            border: 1px solid var(--safe-green);
        }

        .status-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--alert-red);
            border: 1px solid var(--alert-red);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .map-panel {
            flex: 2;
            position: relative;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            z-index: 1;
        }

        .telemetry-panel {
            flex: 1;
            min-width: 300px;
        }

        .telemetry-panel h2 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .data-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .ai-panel {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            flex: 1;
        }

        .confidence-bar-bg {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .confidence-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--safe-green);
            transition: width 0.3s ease, background 0.3s ease;
        }
        
        .threat-alert-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(239, 68, 68, 0.15);
            z-index: 2;
            pointer-events: none;
            display: none;
            border: 4px solid var(--alert-red);
            border-radius: 8px;
        }

        .control-panel {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 8px;
        }

        .control-panel h2 {
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 15px;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .btn-takeoff {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .btn-takeoff:hover { background: rgba(56, 189, 248, 0.3); }

        .btn-rtl {
            background: rgba(16, 185, 129, 0.15);
            color: var(--safe-green);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .btn-rtl:hover { background: rgba(16, 185, 129, 0.3); }

        .btn-land {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.4);
            margin-bottom: 0;
        }
        .btn-land:hover { background: rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body>

    <header>
        <h1>UAV Threat Intelligence</h1>
        <div id="statusBadge" class="status-badge status-safe">
            <span id="statusIcon">●</span> <span id="statusText">SYSTEM SECURE</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Map Panel -->
        <div class="panel map-panel">
            <div id="map"></div>
            <div id="threatOverlay" class="threat-alert-overlay"></div>
        </div>

        <!-- Telemetry Panel -->
        <div class="panel telemetry-panel">
            <h2>Live Telemetry</h2>
            <div class="data-grid">
                <div class="data-card">
                    <div class="data-label">Altitude</div>
                    <div class="data-value" id="valAlt">0.0 m</div>
                </div>
                <div class="data-card">
                    <div class="data-label">Speed</div>
                    <div class="data-value" id="valSpd">0.0 m/s</div>
                </div>
                <div class="data-card">
                    <div class="data-label">Roll</div>
                    <div class="data-value" id="valRoll">0.0°</div>
                </div>
                <div class="data-card">
                    <div class="data-label">Pitch</div>
                    <div class="data-value" id="valPitch">0.0°</div>
                </div>
                <div class="data-card">
                    <div class="data-label">Throttle</div>
                    <div class="data-value" id="valThr">0%</div>
                </div>
                <div class="data-card">
                    <div class="data-label">Heading</div>
                    <div class="data-value" id="valYaw">0.0°</div>
                </div>
            </div>

            <div class="panel ai-panel" style="margin-top: auto;">
                <h2>LSTM Detection Model</h2>
                <div class="data-label">Attack Probability</div>
                <div class="data-value" id="valConf" style="font-size: 2rem;">0.00%</div>
                <div class="confidence-bar-bg">
                    <div id="confBar" class="confidence-bar-fill"></div>
                </div>
            </div>

            <!-- Command & Control Panel -->
            <div class="control-panel">
                <h2>COMMAND & CONTROL</h2>
                <button class="btn btn-takeoff" onclick="sendCommand('TAKEOFF')">Arm & Takeoff (10m)</button>
                <button class="btn btn-rtl" onclick="sendCommand('RTL')">Return to Base (RTL)</button>
                <button class="btn btn-land" onclick="sendCommand('LAND')">Emergency Land</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <script>
        // Initialize Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([0, 0], 2);
        
        // Use a dark-themed map layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // Custom drone icon
        const droneIcon = L.divIcon({
            html: '<div style="background: var(--accent-blue); width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 10px var(--accent-blue);"></div>',
            className: '',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        let marker = L.marker([0, 0], {icon: droneIcon}).addTo(map);
        let isFirstLocation = true;

        // WebSocket Connection
        const socket = io();

        // Send Command to Backend
        function sendCommand(action) {
            socket.emit('send_command', { action: action });
            console.log('Sending command:', action);
        }

        socket.on('telemetry_update', function(data) {
            // Update UI Numbers
            document.getElementById('valAlt').innerText = data.alt.toFixed(1) + ' m';
            document.getElementById('valSpd').innerText = data.speed.toFixed(1) + ' m/s';
            
            // Convert rads to degrees for display
            const rollDeg = data.roll * (180/Math.PI);
            const pitchDeg = data.pitch * (180/Math.PI);
            const yawDeg = data.yaw * (180/Math.PI);
            
            document.getElementById('valRoll').innerText = rollDeg.toFixed(1) + '°';
            document.getElementById('valPitch').innerText = pitchDeg.toFixed(1) + '°';
            document.getElementById('valYaw').innerText = yawDeg.toFixed(1) + '°';
            document.getElementById('valThr').innerText = data.throttle + '%';

            // Update Map
            if (data.lat !== 0 && data.lon !== 0) {
                const newLatLng = new L.LatLng(data.lat, data.lon);
                marker.setLatLng(newLatLng);
                if (isFirstLocation) {
                    map.setView(newLatLng, 17);
                    isFirstLocation = false;
                }
            }

            // Update AI Prediction UI
            const confPercent = (data.confidence * 100).toFixed(2);
            document.getElementById('valConf').innerText = confPercent + '%';
            
            const confBar = document.getElementById('confBar');
            confBar.style.width = confPercent + '%';
            
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const threatOverlay = document.getElementById('threatOverlay');

            if (data.is_attack) {
                // RED ALERT
                statusBadge.className = 'status-badge status-danger';
                statusText.innerText = 'CYBERATTACK DETECTED';
                confBar.style.background = 'var(--alert-red)';
                threatOverlay.style.display = 'block';
                
                // Change marker color to red
                marker.setIcon(L.divIcon({
                    html: '<div style="background: var(--alert-red); width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 15px var(--alert-red);"></div>',
                    className: '',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                }));
            } else {
                // SAFE
                statusBadge.className = 'status-badge status-safe';
                statusText.innerText = 'SYSTEM SECURE';
                confBar.style.background = 'var(--safe-green)';
                threatOverlay.style.display = 'none';
                
                // Restore marker color
                marker.setIcon(droneIcon);
            }
        });
    </script>
</body>
</html>
